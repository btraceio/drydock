name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Debug run: build all artifacts (natives, jbang jar, Windows image), skip tag/push and GitHub release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  setup:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          # Empty on push events; "true"/"false" on workflow_dispatch. Normalized
          # to a concrete string output below so downstream jobs never evaluate
          # github.event.inputs on a push (where the inputs context is absent).
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"; REF="${GITHUB_REF_NAME}"
          else
            V="$INPUT_VERSION"; REF="v${V}"
          fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$V' (expected X.Y.Z)"; exit 1
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then DRY=true; else DRY=false; fi
          {
            echo "version=$V"
            echo "ref=$REF"
            echo "dry_run=$DRY"
          } >> "$GITHUB_OUTPUT"

  prepare:
    name: Bump version and tag
    needs: setup
    if: ${{ github.event_name == 'workflow_dispatch' && needs.setup.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump, commit, tag, push
        env:
          V: ${{ needs.setup.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i -E "s/^version = \".*\"/version = \"${V}\"/" app/build.gradle.kts
          sed -i -E "s/^version = \".*\"/version = \"${V}\"/" build.gradle.kts
          sed -i -E "s|(\"script-ref\": \")[^\"]*(\")|\1https://github.com/btraceio/drydock/releases/download/v${V}/drydock-${V}.jar\2|" jbang-catalog.json
          grep -q "version = \"${V}\"" app/build.gradle.kts || { echo "::error::version bump failed"; exit 1; }
          grep -q "version = \"${V}\"" build.gradle.kts || { echo "::error::root version bump failed"; exit 1; }
          grep -q "releases/download/v${V}/drydock-${V}.jar" jbang-catalog.json || { echo "::error::catalog bump failed"; exit 1; }
          git add app/build.gradle.kts build.gradle.kts jbang-catalog.json
          git commit -m "Release v${V}"
          git tag -a "v${V}" -m "Release v${V}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${V}"

  # Build each macOS arch slice natively on its own runner, both on the macOS 15
  # image generation. ghostty's pkg/macos references kCVPixelFormatType_30RGB_r210,
  # a CoreVideo constant added in the macOS 15 SDK; the older macos-14 image
  # (14.5 SDK) lacks it and the ghostty build fails regardless of native vs
  # cross-compile. arm64 -> macos-15, x86_64 -> macos-15-intel.
  native:
    name: Build native (${{ matrix.arch }})
    needs: [setup, prepare]
    if: ${{ always() && needs.setup.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # In a dry run the tag does not exist yet (prepare is skipped), so
          # build from the triggering ref instead of needs.setup.outputs.ref.
          ref: ${{ needs.setup.outputs.dry_run == 'true' && github.ref || needs.setup.outputs.ref }}
          submodules: recursive
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - name: Ensure Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal Toolchain already present or bundled"
      - name: Build native libraries (${{ matrix.arch }})
        env:
          NATIVE_ARCHES: ${{ matrix.arch }}
        run: |
          bash scripts/build-ghostty.sh
          bash scripts/build-native-host.sh
      - name: Upload native libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: natives-macos-${{ matrix.arch }}
          path: |
            build/native/macos-${{ matrix.arch }}/libghostty.dylib
            build/native/macos-${{ matrix.arch }}/libdrydockterminalhost.dylib
          if-no-files-found: error

  # Package the jbang launcher jar (natives-bundled, macOS-only natives) from
  # the native artifacts. This used to live in the stage-maven job, which also
  # published io.btrace:drydock to Maven Central; publication is gone -- the
  # jar is attached to the GitHub release directly and jbang-catalog.json
  # points at the release asset URL -- so the job is now build-only: no
  # Sonatype/GPG secrets, no staging, no wait-for-Central poll.
  jbang-jar:
    name: Build jbang jar
    needs: [setup, prepare, native]
    if: ${{ always() && needs.setup.result == 'success' && needs.native.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # In a dry run the tag does not exist yet (prepare is skipped), so
          # build from the triggering ref instead of needs.setup.outputs.ref.
          ref: ${{ needs.setup.outputs.dry_run == 'true' && github.ref || needs.setup.outputs.ref }}
          submodules: recursive
      - name: Download arm64 native libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: natives-macos-arm64
          path: build/native/macos-arm64
      - name: Download x86_64 native libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: natives-macos-x86_64
          path: build/native/macos-x86_64
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: |
            26
            17
      - name: Build jbang jar
        run: |
          ./gradlew :app:jbangJar \
            --no-daemon --stacktrace \
            -Pnatives.prebuilt=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_ARM64,JAVA_HOME_26_ARM64
      - name: Upload jbang jar for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drydock-jbang-jar
          path: app/build/libs/drydock-${{ needs.setup.outputs.version }}.jar
          if-no-files-found: error

  # Build the Windows jlink runtime image natively on a Windows x64 runner and
  # zip it with a top-level folder so unzipping does not splatter bin/ and
  # runtime/ into the current directory. Mirrors the windows-runtime-image job
  # in tests.yml (same runner requirements: JDK 26 toolchain for the app, JDK
  # 17 for the Gradle daemon -- windows-latest has neither preinstalled).
  windows-image:
    name: Build Windows image (x64)
    needs: [setup, prepare]
    if: ${{ always() && needs.setup.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.setup.outputs.dry_run == 'true' && github.ref || needs.setup.outputs.ref }}
          submodules: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 26
          cache: gradle
      # Gradle's own daemon runs on JDK 17 (gradle/gradle-daemon-jvm.properties
      # toolchainVersion=17); windows-latest has no preinstalled 17 and no
      # toolchain download URL is configured, so without this the build dies
      # before the app ever compiles.
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the Windows runtime image
        shell: bash
        run: ./gradlew --no-daemon :app:windowsRuntimeImage
      - name: Verify image layout
        shell: bash
        run: |
          test -f build/image-windows/bin/drydock.bat
          test -d build/image-windows/runtime/bin
      - name: Zip the image (top-level drydock-windows-x64 folder)
        env:
          V: ${{ needs.setup.outputs.version }}
        shell: pwsh
        run: |
          Rename-Item build/image-windows "drydock-windows-x64"
          Compress-Archive -Path build/drydock-windows-x64 \
            -DestinationPath "drydock-windows-x64-$env:V.zip"
      - name: Upload Windows image for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drydock-windows-image
          path: drydock-windows-x64-${{ needs.setup.outputs.version }}.zip
          if-no-files-found: error

  create-github-release:
    name: Create GitHub Release
    needs: [setup, jbang-jar, windows-image]
    if: ${{ always() && needs.jbang-jar.result == 'success' && needs.windows-image.result == 'success' && needs.setup.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: drydock-jbang-jar
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: drydock-windows-image
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ needs.setup.outputs.version }}"
          JAR="dist/drydock-${V}.jar"
          WINZIP="dist/drydock-windows-x64-${V}.zip"
          # Idempotent: if a release already exists for this tag (e.g. a manual
          # placeholder, or a re-run), attach/refresh the assets instead of
          # failing.
          if gh release view "v${V}" >/dev/null 2>&1; then
            echo "Release v${V} already exists; uploading assets (clobber)."
            gh release upload "v${V}" "$JAR" "$WINZIP" --clobber
          else
            gh release create "v${V}" \
              --title "Drydock v${V}" \
              --generate-notes \
              "$JAR" "$WINZIP"
          fi
