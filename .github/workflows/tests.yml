name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch or PR makes the in-flight run pointless.
  # The main branch is excluded so every merged commit keeps a result.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: app:test
    # macOS because the product is macOS-only, and because the git-backed
    # tests exercise the same `git` this app spawns at runtime. The suite
    # itself needs no native libraries: libghostty is only wired into the
    # `run` and packaging tasks, never into `test`.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No `submodules: recursive` on purpose: third_party/ghostty is read
          # only by buildGhosttyNative, a lazily registered task that :app:test
          # never realises. Verified by configuring the build against an empty
          # submodule directory. Skipping it keeps every run cheap; add it back
          # if a future test task needs the natives.
          submodules: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 26
          cache: gradle

      # Deliberately no `git config --global user.*` here. The fixtures set a
      # repo-local identity themselves, which is what makes them self-contained;
      # papering over it globally would hide the next fixture that forgets, and
      # that failure is far easier to diagnose here than on a contributor's
      # machine that happens to have one configured.
      - name: Test
        run: ./gradlew --no-daemon :app:test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/test
            app/build/test-results/test
          retention-days: 7

  jediterm-spike:
    name: jeditermSpike (Windows)
    # The JediTermFX + pty4j spike is pure Java + pty4j's own native PTY
    # libs -- no Zig, no Xcode, no libghostty -- so it is the one piece of
    # the project that CAN run on Windows today, and running it there is the
    # only way to exercise the ConPTY (cmd.exe) path this macOS dev host
    # cannot. The full app stays macOS-only; this job verifies only the
    # candidate Windows terminal backend (see docs/windows-terminal-spike.md).
    #
    # It opens a real JavaFX window and auto-exits once the shell does, so it
    # needs a desktop session. windows-latest hosts one; if a future runner
    # image cannot, add the Monocle headless path the :app:test job uses
    # (glass.platform=Monocle + monocle on the spike runtime classpath) rather
    # than dropping the job -- the whole point is to run the real Windows
    # ConPTY + JavaFX render path.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The spike needs no submodule: third_party/ghostty is read only by
          # buildGhosttyNative, which jeditermSpike does not depend on
          # (requireNativeBuild=false in buildSrc/.../drydock.spikes.gradle.kts).
          submodules: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 26
          cache: gradle

      # Gradle's own daemon runs on JDK 17 (gradle/gradle-daemon-jvm.properties
      # toolchainVersion=17). macos-14 has a preinstalled 17 that toolchain
      # detection finds; windows-latest does not, and no toolchain download
      # URL is configured, so without this the build dies before the spike
      # even runs with "No defined toolchain download url for WINDOWS". The
      # app itself still compiles and runs on the JDK 26 toolchain above.
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      # shell: bash so ./gradlew (the POSIX wrapper) runs identically to the
      # macOS job; Git Bash on windows-latest handles it.
      - name: JediTermFX + pty4j spike
        shell: bash
        run: ./gradlew --no-daemon :app:jeditermSpike