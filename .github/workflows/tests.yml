name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch or PR makes the in-flight run pointless.
  # The main branch is excluded so every merged commit keeps a result.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: app:test
    # macOS because the product is macOS-only, and because the git-backed
    # tests exercise the same `git` this app spawns at runtime. The suite
    # itself needs no native libraries: libghostty is only wired into the
    # `run` and packaging tasks, never into `test`.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No `submodules: recursive` on purpose: third_party/ghostty is read
          # only by buildGhosttyNative, a lazily registered task that :app:test
          # never realises. Verified by configuring the build against an empty
          # submodule directory. Skipping it keeps every run cheap; add it back
          # if a future test task needs the natives.
          submodules: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 26
          cache: gradle

      # Deliberately no `git config --global user.*` here. The fixtures set a
      # repo-local identity themselves, which is what makes them self-contained;
      # papering over it globally would hide the next fixture that forgets, and
      # that failure is far easier to diagnose here than on a contributor's
      # machine that happens to have one configured.
      - name: Test
        run: ./gradlew --no-daemon :app:test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/test
            app/build/test-results/test
          retention-days: 7

  jediterm-spike:
    name: jeditermSpike (Windows)
    # The JediTermFX + pty4j spikes are pure Java + pty4j's own native PTY
    # libs -- no Zig, no Xcode, no libghostty -- so they are the one piece of
    # the project that CAN run on Windows today, and running them there is the
    # only way to exercise the ConPTY (cmd.exe) path this macOS dev host
    # cannot. The full app stays macOS-only; this job verifies the candidate
    # Windows terminal backend (see docs/windows-terminal-spike.md).
    #
    # Two spikes run: jeditermSpike (the raw JediTermFxWidget + pty4j, covers
    # submitLine through ConPTY) and nodeTerminalSpike (drives the real
    # TerminalFactory + the JediTermFX terminal.api impls through
    # openSurface/processExited/closeGracefully -- the integration layer).
    #
    # Each opens a real JavaFX window and auto-exits, so they need a desktop
    # session. windows-latest hosts one; if a future runner image cannot, add
    # the Monocle headless path the :app:test job uses (glass.platform=Monocle
    # + monocle on the spike runtime classpath) rather than dropping the job.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 26
          cache: gradle

      # Gradle's own daemon runs on JDK 17 (gradle/gradle-daemon-jvm.properties
      # toolchainVersion=17). macos-14 has a preinstalled 17 that toolchain
      # detection finds; windows-latest does not, and no toolchain download
      # URL is configured, so without this the build dies before the spike
      # even runs with "No defined toolchain download url for WINDOWS". The
      # app itself still compiles and runs on the JDK 26 toolchain above.
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: JediTermFX spikes (raw widget + TerminalFactory integration)
        shell: bash
        run: ./gradlew --no-daemon :app:jeditermSpike :app:nodeTerminalSpike

  boot-spike:
    name: bootSpike (Windows)
    # Verifies the REAL app boots on Windows and opens a terminal-only session
    # through the production SessionManager/OpenSessionTab path -- no claude
    # installed (a diag command override bypasses the agent provider and runs
    # `echo` via ConPTY). Stronger than the spikes: it exercises
    # DrydockApplication startup, repo registration, session open, the
    # JediTermFX backend through the real TerminalFactory, and orderly shutdown
    # via the app's own diagQuit. The task's exit code is the pass/fail (the app
    # exits cleanly via diagQuit's watchdog, no kill). See
    # docs/windows-terminal-spike.md.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 26
          cache: gradle

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create throwaway repo
        shell: bash
        run: |
          mkdir -p build/boot-repo && cd build/boot-repo
          git init -q
          git config user.email t@t.t
          git config user.name t
          printf 'hi\n' > README.md
          git add . && git commit -qm init

      - name: Boot spike (terminal-only session via ConPTY)
        shell: bash
        run: |
          ./gradlew --no-daemon :app:bootSpike \
            -Papp.drydock.terminal.backend=jediterm \
            -Papp.drydock.diag.repo=build/boot-repo \
            -Papp.drydock.diag.autoCreateSession=true \
            '-Papp.drydock.diag.command=echo DRYDOCK_SESSION_OK' \
            -Papp.drydock.diag.autoExitSeconds=15 \
            -Papp.drydock.diag.stateFile=build/diag-state.json

  gradle-run-smoke:
    name: gradleRunSmoke (Windows)
    # Verifies the production `gradlew :app:run` task launches on Windows --
    # stronger than the boot-spike job above because bootSpike uses a typed
    # JavaExec that sets its OWN jvmArgs, so it bypasses the
    # applicationDefaultJvmArgs list that gates `gradlew run`. This job runs
    # the actual `run` task with the diag flags forwarded via `-D`, opening
    # a real JavaFX window on the windows-latest desktop session, exercising
    # SessionManager/OpenSessionTab/TerminalFactory/JediTermFX the same way
    # a colleague would when launching from a checkout. The app's own
    # diagQuit watchdog (app.drydock.diag.autoExitSeconds) shuts it down
    # cleanly so the task exit code is the pass/fail. Catches the regression
    # where a -Xdock:*/-Dglass.platform-style JVM flag is added to
    # applicationDefaultJvmArgs unguarded and would crash a Windows JVM at
    # launch (see commit "Drop -Xdock:name from applicationDefaultJvmArgs
    # on non-macOS").
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 26
          cache: gradle

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create throwaway repo
        shell: bash
        run: |
          mkdir -p build/boot-repo && cd build/boot-repo
          git init -q
          git config user.email t@t.t
          git config user.name t
          printf 'hi\n' > README.md
          git add . && git commit -qm init

      - name: gradle :app:run smoke (terminal-only session via ConPTY)
        shell: bash
        run: |
          ./gradlew --no-daemon :app:run \
            -Dapp.drydock.terminal.backend=jediterm \
            -Dapp.drydock.diag.repo=build/boot-repo \
            -Dapp.drydock.diag.autoCreateSession=true \
            '-Dapp.drydock.diag.command=echo DRYDOCK_SESSION_OK' \
            -Dapp.drydock.diag.autoExitSeconds=15 \
            -Dapp.drydock.diag.stateFile=build/diag-state.json